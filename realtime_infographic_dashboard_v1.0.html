<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실시간 인포그래픽 대시보드 v1.0</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.2/papaparse.min.js"></script><style>:root{color-scheme:dark;--bg:#081121;--panel:#111e32;--edge:#25344d;--muted:#91a4bd;--accent:#60a5fa;--good:#34d399}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#152d50,#081121 48%);font-family:system-ui,'Noto Sans KR',sans-serif;color:#eaf1fb}main{max-width:1480px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:clamp(24px,3vw,36px);margin:5px 0}h2{font-size:17px;margin:0 0 18px}.eyebrow{color:#6ee7f9;font-weight:700;letter-spacing:.15em;font-size:11px}.sub,.hint{color:var(--muted);font-size:13px}.status{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:#fbbf24;box-shadow:0 0 13px #fbbf2477}.dot.ok{background:#34d399;box-shadow:0 0 13px #34d39977}.panel{background:linear-gradient(150deg,#14243b,#0e192b);border:1px solid var(--edge);border-radius:18px;padding:21px;box-shadow:0 10px 28px #0002}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:22px 0}.control{display:flex;flex-direction:column;gap:6px;min-width:150px;flex:1}.control label{font-size:12px;color:var(--muted)}select,input,button{background:#0c1829;color:#eaf1fb;border:1px solid #33445d;border-radius:10px;padding:11px;font:inherit;min-width:0}button{cursor:pointer;background:#1d4ed8;border-color:#2563eb;font-weight:700}button:hover{filter:brightness(1.18)}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.kpi{position:relative;overflow:hidden;min-height:148px}.kpi:after{content:'◉';position:absolute;right:14px;top:8px;color:#60a5fa22;font-size:78px}.kpi .label{font-size:13px;color:var(--muted)}.kpi .value{font-size:clamp(24px,3vw,36px);font-weight:800;margin:20px 0 8px;overflow-wrap:anywhere}.kpi .foot{color:#7dd3fc;font-size:12px}.charts{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}.chartbox{height:330px;position:relative}.chartbox canvas{max-height:100%}.wide{grid-column:span 2}.tablewrap{overflow:auto;max-height:420px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid #28364b;white-space:nowrap}th{color:#a8c2e2;position:sticky;top:0;background:#15243a}td{color:#d5e2f3}.notice{padding:13px 16px;border:1px solid #755b2d;background:#3a2a1633;border-radius:10px;color:#fcdba1;margin:14px 0;display:none;line-height:1.5}footer{color:#7186a2;font-size:12px;margin-top:24px;text-align:center}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.wide{grid-column:span 1}}@media(max-width:520px){main{padding:14px}.kpis{gap:9px}.panel{padding:15px}.kpi .value{font-size:25px}.toolbar{gap:8px}}</style></head><body><main><header><div><div class="eyebrow">LIVE DATA INTELLIGENCE</div><h1>실시간 데이터 대시보드</h1><div class="sub">Google Sheets · 자동 인포그래픽 · 데이터 기반 지표</div></div><div class="status"><span id="dot" class="dot"></span><span id="status">연결 준비 중</span></div></header><div id="notice" class="notice"></div><section class="toolbar panel"><div class="control"><label>숫자 분석 지표</label><select id="metric"></select></div><div class="control"><label>분류 기준</label><select id="category"></select></div><div class="control"><label>기간 / 날짜 열</label><select id="datecol"></select></div><div class="control"><label>항목 필터</label><select id="filter"><option value="">전체 항목</option></select></div><div class="control"><label>자동 갱신 주기</label><select id="interval"><option value="30000">30초</option><option value="60000" selected>1분</option><option value="300000">5분</option><option value="0">사용 안 함</option></select></div><div class="control"><label>데이터 검색</label><input id="search" placeholder="키워드 검색"></div><button id="refresh">↻ 새로고침</button></section><section id="kpis" class="kpis"></section><section class="charts"><article class="panel"><h2 id="trendtitle">데이터 추이</h2><div class="chartbox"><canvas id="trend"></canvas></div></article><article class="panel"><h2>항목별 구성 비율</h2><div class="chartbox"><canvas id="donut"></canvas></div></article><article class="panel wide"><h2>항목별 지표 비교 TOP 12</h2><div class="chartbox"><canvas id="bar"></canvas></div></article><article class="panel wide"><h2>원본 데이터 미리보기 <span class="hint" id="count"></span></h2><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><p class="hint">미리보기는 최대 100행이며 차트와 지표는 필터된 전체 데이터로 계산됩니다.</p></article></section><footer><span id="updated">마지막 업데이트: -</span> · CSV 공개 주소를 브라우저에서 직접 조회 · v1.0</footer></main><script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRH89GHl3WYDeM1deIr9LioSqjHcHDbyiGzaGJrpql1E9nVkzCZUSaoQ0c9a62wcgoDITrrYngwQ6Wf/pub?output=csv';
const $=id=>document.getElementById(id);let raw=[],cols=[],numeric=[],categorical=[],dates=[],charts={},timer=null;const colors=['#60a5fa','#34d399','#fbbf24','#a78bfa','#fb7185','#22d3ee','#f97316','#c084fc','#84cc16','#f472b6','#38bdf8','#eab308'];
const clean=v=>String(v??'').trim();const num=v=>{let s=clean(v).replace(/[₩$€£,%\s]/g,'').replace(/,/g,'');if(/^\(.*\)$/.test(s))s='-'+s.slice(1,-1);return s!==''&&Number.isFinite(Number(s))?Number(s):NaN};const fmt=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:2}).format(n);const esc=s=>clean(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const short=s=>s.length>20?s.slice(0,19)+'…':s;
function isDate(v){const s=clean(v);return /^(19|20)\d{2}[-/.년]\s*\d{1,2}/.test(s)&&!isNaN(Date.parse(s.replace(/[년월]/g,'-').replace(/일/g,'').replace(/\./g,'/')))}function dateKey(v){const s=clean(v).replace(/[년월]/g,'-').replace(/일/g,'').replace(/\./g,'/');const d=new Date(s);return isNaN(d)?null:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function options(id,items,preferred){const el=$(id),old=el.value;el.innerHTML=items.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');el.value=items.includes(old)?old:items.includes(preferred)?preferred:items[0]||''}
function infer(){cols=Object.keys(raw[0]||{});numeric=cols.filter(c=>{const vals=raw.map(r=>clean(r[c])).filter(Boolean);return vals.length&&vals.filter(v=>!isNaN(num(v))).length/vals.length>=.75});dates=cols.filter(c=>{const vals=raw.map(r=>clean(r[c])).filter(Boolean);return vals.length&&vals.filter(isDate).length/vals.length>=.7});categorical=cols.filter(c=>!numeric.includes(c)&&!dates.includes(c));options('metric',['(건수)',...numeric],numeric[0]);options('category',['(전체)',...categorical,...dates],categorical[0]);options('datecol',['(없음)',...dates],dates[0]);updateFilter()}
function updateFilter(){const c=$('category').value;const values=c==='(전체)'?[]:[...new Set(raw.map(r=>clean(r[c])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko')).slice(0,2000);options('filter',['',...values]);$('filter').options[0].textContent='전체 항목'}
function filtered(){const c=$('category').value,f=$('filter').value,q=$('search').value.trim().toLowerCase();return raw.filter(r=>(!f||clean(r[c])===f)&&(!q||cols.some(k=>clean(r[k]).toLowerCase().includes(q))))}function metricVal(r){return $('metric').value==='(건수)'?1:(num(r[$('metric').value])||0)}
function group(rows,c){const m=new Map();rows.forEach(r=>{const k=c==='(전체)'?'전체':clean(r[c])||'(빈 값)';m.set(k,(m.get(k)||0)+metricVal(r))});return [...m].sort((a,b)=>b[1]-a[1])}function renderChart(id,type,labels,values,extra={}){if(charts[id])charts[id].destroy();if(!window.Chart)return;charts[id]=new Chart($(id),{type,data:{labels,datasets:[{label:$('metric').value==='(건수)'?'건수':$('metric').value,data:values,backgroundColor:type==='line'?'#60a5fa44':labels.map((_,i)=>colors[i%colors.length]),borderColor:type==='line'?'#60a5fa':colors,borderWidth:type==='line'?3:0,fill:type==='line',tension:.32,borderRadius:type==='bar'?6:0,pointRadius:type==='line'?3:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:type==='doughnut',position:'bottom',labels:{color:'#c5d3e7',boxWidth:10}},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${fmt(ctx.parsed.y??ctx.parsed)}`}}},scales:type==='doughnut'?{}:{x:{ticks:{color:'#91a4bd',maxRotation:45,minRotation:0},grid:{display:false}},y:{beginAtZero:true,ticks:{color:'#91a4bd'},grid:{color:'#26364d'}}},...extra}})}
function render(){const rows=filtered(),v=rows.map(metricVal),sum=v.reduce((a,b)=>a+b,0),cat=$('category').value,groups=group(rows,cat),m=$('metric').value,nonEmpty=rows.filter(r=>m==='(건수)'||Number.isFinite(num(r[m]))).length;const cards=[['데이터 건수',fmt(rows.length),'현재 필터 기준'],[m==='(건수)'?'전체 건수':m+' 합계',fmt(sum),'선택한 지표의 총합'],[m==='(건수)'?'항목당 평균 건수':m+' 평균',fmt(nonEmpty?sum/nonEmpty:0),'유효 숫자 기준'],['고유 항목 수',fmt(groups.length),'선택한 분류 기준']];$('kpis').innerHTML=cards.map(([a,b,c])=>`<article class="panel kpi"><div class="label">${esc(a)}</div><div class="value">${esc(b)}</div><div class="foot">${esc(c)}</div></article>`).join('');const top=groups.slice(0,12);renderChart('bar','bar',top.map(x=>short(x[0])),top.map(x=>x[1]),{indexAxis:'y'});let pie=groups.slice(0,7);if(groups.length>7)pie.push(['기타',groups.slice(7).reduce((s,x)=>s+x[1],0)]);renderChart('donut','doughnut',pie.map(x=>short(x[0])),pie.map(x=>Math.max(0,x[1])));const dc=$('datecol').value;let timeline;if(dc!=='(없음)'){const map=new Map();rows.forEach(r=>{const k=dateKey(r[dc]);if(k)map.set(k,(map.get(k)||0)+metricVal(r))});timeline=[...map].sort((a,b)=>a[0].localeCompare(b[0]));$('trendtitle').textContent='날짜별 지표 추이'}else{timeline=groups.slice(0,25).reverse();$('trendtitle').textContent='분류별 지표 흐름 (날짜 열 없음)'}renderChart('trend','line',timeline.map(x=>short(x[0])),timeline.map(x=>x[1]));$('count').textContent=`(${fmt(rows.length)}건)`;$('thead').innerHTML='<tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr>';$('tbody').innerHTML=rows.slice(0,100).map(r=>'<tr>'+cols.map(c=>`<td title="${esc(r[c])}">${esc(clean(r[c]).slice(0,120))}</td>`).join('')+'</tr>').join('')||'<tr><td>표시할 데이터가 없습니다.</td></tr>'}
async function load(){const previous=raw.length;$('status').textContent='데이터 동기화 중…';$('dot').className='dot';try{const url=CSV_URL+(CSV_URL.includes('?')?'&':'?')+'_ts='+Date.now();const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const csv=await response.text();if(!csv.trim()||/^\s*<!doctype html/i.test(csv))throw Error('유효한 CSV 응답이 아닙니다');if(!window.Papa)throw Error('CSV 파서 라이브러리를 불러오지 못했습니다');const parsed=Papa.parse(csv,{header:true,skipEmptyLines:'greedy',transformHeader:h=>h.trim()});if(parsed.errors.length&&parsed.data.length===0)throw Error(parsed.errors[0].message);const rows=parsed.data.filter(r=>Object.values(r).some(v=>clean(v)));if(!rows.length)throw Error('CSV에 데이터 행이 없습니다');const signature=JSON.stringify(Object.keys(rows[0]));const changed=signature!==JSON.stringify(cols);raw=rows;if(changed||!previous)infer();else updateFilter();render();$('notice').style.display='none';$('status').textContent=`연결됨 · ${fmt(raw.length)}행`;$('dot').className='dot ok';$('updated').textContent='마지막 업데이트: '+new Date().toLocaleString('ko-KR')}catch(e){$('status').textContent=previous?'연결 오류 · 이전 데이터 표시':'데이터 연결 실패';$('notice').style.display='block';$('notice').textContent='CSV 데이터를 불러오지 못했습니다: '+e.message+'. 공개 게시 상태, 인터넷 연결, 브라우저의 CORS 정책을 확인하세요. HTML을 file://로 실행했다면 로컬 웹 서버 또는 웹 호스팅에서 열어보세요.';console.error(e)}}
['metric','datecol','filter','search'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('category').addEventListener('change',()=>{updateFilter();render()});$('refresh').addEventListener('click',load);function schedule(){clearInterval(timer);const ms=Number($('interval').value);if(ms>0)timer=setInterval(load,ms)}$('interval').addEventListener('change',schedule);schedule();load();
</script></body></html>
